# إعدادات النشر على Netlify (Next.js runtime)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# إضافة Next.js Runtime الرسمية (تثبّتها Netlify تلقائيًا)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# رؤوس أمان إضافية على مستوى الشبكة
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# إعادة توجيه المسارات القديمة إن وُجدت لاحقًا
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301
