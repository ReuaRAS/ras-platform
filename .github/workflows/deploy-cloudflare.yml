name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SB_URL" ] || missing="$missing vars.NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$SB_KEY" ] || missing="$missing vars.NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$APP_URL" ] || missing="$missing vars.NEXT_PUBLIC_APP_URL"
          if [ -n "$missing" ]; then
            echo "::error::إعدادات ناقصة في GitHub: $missing — راجع README → النشر"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # يُنشئ مخزن الكاش أول مرة فقط؛ تجاهل الفشل إن كان موجودًا.
      - name: Ensure R2 cache bucket
        continue-on-error: true
        run: npx wrangler r2 bucket create ras-platform-cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # اختياري: إن أضفت SUPABASE_SERVICE_ROLE_KEY في أسرار GitHub يُضبط على العامل
      # بعد كل نشر، فلا تحتاج إضافته يدويًا في لوحة Cloudflare.
      - name: Sync Supabase service key
        if: ${{ env.SB_SERVICE_KEY != '' }}
        run: printf '%s' "$SB_SERVICE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
